on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned to a commit because the workflow holds a write token.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@17264ce002a9359a492e0183852a555a5bb866e7 # v1 (v1.23.0)
    permissions:
      contents: write
    with:
      # A ruleset requires pull requests on main, so the badge goes to
      # gh-pages, which the pkgdown deploy already writes to.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg

# Guards src/vendor/. tools/vendor/verify re-derives the PCRE2 tree from the
# pinned release archive plus the declared patches, and on pull requests the
# guard fails when src/vendor/ changes without tools/vendor/manifest.tsv and
# tools/vendor/checksums.sha256 changing with it.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "2 18 * * 0"
  workflow_dispatch:
  pull_request:

name: vendor.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
